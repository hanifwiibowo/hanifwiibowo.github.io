<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Hanif Wibowo</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Hanif Wibowo, Business Statistics student at ITS. Data analysis, data science, business intelligence, UI/UX design and web development.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,600;0,700;1,500;1,600;1,700&family=Poppins:wght@400;500;600;700;800&family=Figtree:wght@400;500;600&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* Layout: "Halo!" bento hero (name banner, intro, tool tiles, photo) then rounded slide panels; navy year badges; data first */
:root{
  --bg:#FFFFFF;
  --panel:#EEF1F7;
  --sky:#D3E9FB;
  --blue:#5AA7EE;
  --cyan:#2A8BD6;
  --royal:#2242A3;
  --navy:#0D1D4A;
  --ink:#0D1D4A;
  --muted:#4E5A78;
  --line:rgba(13,29,74,.12);
  --on-dark:#FFFFFF;
  --on-blue:#0D1D4A;
  --tile:#FFFFFF;
  --f-display:"Poppins","Segoe UI",Arial,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-serif:"Playfair Display",Georgia,"Times New Roman",serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r-lg:30px;
  --r:20px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#081230;--panel:#111D45;--sky:#17295C;--blue:#3F86D6;--cyan:#6CC4FF;--royal:#86A3FF;--navy:#E6ECFF;--ink:#E6ECFF;--muted:#A7B3D6;--line:rgba(230,236,255,.14);--on-dark:#081230;--on-blue:#FFFFFF;--tile:#0B1638;color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#081230;--panel:#111D45;--sky:#17295C;--blue:#3F86D6;--cyan:#6CC4FF;--royal:#86A3FF;--navy:#E6ECFF;--ink:#E6ECFF;--muted:#A7B3D6;--line:rgba(230,236,255,.14);--on-dark:#081230;--on-blue:#FFFFFF;--tile:#0B1638;color-scheme:dark}

*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:84px}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16.5px;line-height:1.6;margin:0;overflow-x:hidden}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--bg)}
a{color:inherit}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0;letter-spacing:-.02em}
p{margin:0}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px;border-radius:8px}
.wrap{max-width:1180px;margin-inline:auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
section{padding-block:clamp(56px,8vw,96px)}
.eyebrow{font-family:var(--f-mono);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--royal);font-weight:500}
.tags{display:flex;flex-wrap:wrap;gap:6px;list-style:none;margin:0;padding:0}
.tags li{font-family:var(--f-mono);font-size:12.5px;padding:5px 10px;border-radius:8px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.tags li.hit{background:var(--royal);color:var(--bg);border-color:var(--royal)}
.btn{all:unset;box-sizing:border-box;cursor:pointer;display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:15px;padding:12px 20px;border-radius:999px;text-decoration:none;transition:transform .15s,background .15s}
.btn.solid{background:var(--royal);color:var(--bg)}
.btn.ghost{background:var(--bg);color:var(--ink);border:1.5px solid var(--line)}
.btn:hover{transform:translateY(-2px)}
.btn:focus-visible{outline:3px solid var(--blue);outline-offset:3px}

/* nav */
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.nav .wrap{display:flex;align-items:center;gap:20px;padding-block:14px}
.logo{font-family:var(--f-serif);font-weight:700;font-style:italic;font-size:22px;text-decoration:none;letter-spacing:-.01em}
.logo span{color:var(--royal)}
.nav ul{display:flex;gap:4px;list-style:none;margin:0 0 0 auto;padding:0;flex-wrap:wrap}
.nav ul a{display:block;text-decoration:none;font-size:14.5px;font-weight:500;padding:7px 12px;border-radius:999px;color:var(--muted)}
.nav ul a:hover,.nav ul a.on{background:var(--panel);color:var(--ink)}
.theme{all:unset;cursor:pointer;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;background:var(--panel);flex:none}
.theme svg{width:18px;height:18px}



/* opening */
.open{padding-top:clamp(36px,6vw,80px);padding-bottom:clamp(32px,5vw,64px)}
.ogrid{display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr);gap:clamp(20px,4vw,48px);align-items:center}
.oword{font-family:var(--f-display);font-weight:800;font-size:clamp(72px,13vw,168px);line-height:.85;letter-spacing:-.055em;color:var(--royal);margin:0}
.osub{font-family:var(--f-display);font-weight:700;font-size:clamp(19px,2.4vw,30px);line-height:1.2;color:var(--cyan);margin-top:14px;letter-spacing:-.01em}
.oname{display:block;color:var(--ink);font-family:var(--f-serif);font-style:italic;font-weight:700;font-size:clamp(44px,6.4vw,84px);line-height:1;margin-top:10px;letter-spacing:-.01em}
.otag{font-size:clamp(18px,1.9vw,22px);line-height:1.45;max-width:34rem;margin-top:22px;color:var(--muted)}
.otag strong{color:var(--ink);font-weight:600}
.open .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:28px}
.oart{background:var(--sky);border-radius:var(--r-lg);aspect-ratio:1/1;max-width:100%;position:relative;overflow:hidden}
.oart svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.oart .grow{transform-origin:bottom;transform-box:fill-box;animation:grow .9s cubic-bezier(.3,1.3,.5,1) both}
@keyframes grow{from{transform:scaleY(.15)}to{transform:none}}
@media (max-width:860px){.ogrid{grid-template-columns:1fr}.oart{aspect-ratio:16/10}}

/* hello hero */
.hello{padding-top:clamp(24px,4vw,48px);padding-bottom:clamp(36px,5vw,64px)}
.hgrid{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,3fr) minmax(0,4fr);grid-template-areas:"hi hi photo" "name name photo" "intro tools photo";gap:16px}
.hi{grid-area:hi;font-family:var(--f-display);font-weight:800;font-size:clamp(56px,8vw,96px);line-height:.95;color:var(--royal);letter-spacing:-.04em;margin:0;padding-top:8px}
.namebar{grid-area:name;background:var(--sky);border-radius:var(--r-lg);padding:20px 28px;display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:6px 16px}
.namebar h2{font-weight:700;font-size:clamp(28px,3.6vw,42px);letter-spacing:-.025em;line-height:1.05}
.namebar .eyebrow{color:var(--royal)}
.intro{grid-area:intro;background:var(--panel);border-radius:var(--r-lg);padding:clamp(22px,2.6vw,30px);display:flex;flex-direction:column;gap:18px;min-width:0}
.intro p{font-family:var(--f-display);font-weight:400;font-size:clamp(17px,1.6vw,19px);line-height:1.5}
.intro p b{font-weight:700}
.intro .cta{display:flex;flex-wrap:wrap;gap:10px;margin-top:auto}
.tools{grid-area:tools;background:var(--panel);border-radius:var(--r-lg);padding:22px;display:flex;flex-direction:column;gap:14px;min-width:0}
.tools h3{font-weight:800;font-size:30px;color:var(--royal);text-align:center;letter-spacing:-.03em}
.tiles{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;justify-items:center}
.tile{all:unset;cursor:pointer;color:var(--navy);position:relative;width:100%;max-width:64px;aspect-ratio:1;border-radius:50%;background:#FFFFFF;display:grid;place-items:center;box-shadow:0 2px 0 var(--line);transition:transform .2s cubic-bezier(.3,1.6,.5,1),box-shadow .2s}
.tile:hover{transform:translateY(-4px) rotate(-6deg)}
.tile[aria-pressed="true"]{box-shadow:0 0 0 3px var(--royal);transform:scale(1.06)}
.tile:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.tile img{width:62%;height:62%;object-fit:contain;display:block}
.tname{font-family:var(--f-display);font-weight:700;font-size:11.5px;line-height:1.1;text-align:center;color:var(--royal);padding:0 4px;word-break:break-word}
.tile .tip{position:absolute;bottom:calc(100% + 8px);left:50%;transform:translateX(-50%) translateY(4px);background:var(--navy);color:var(--on-dark);font-family:var(--f-mono);font-size:11.5px;padding:4px 8px;border-radius:6px;white-space:nowrap;opacity:0;pointer-events:none;transition:opacity .15s,transform .15s;z-index:3}
.tile:hover .tip,.tile:focus-visible .tip{opacity:1;transform:translateX(-50%) translateY(0)}
.used{font-size:13.5px;line-height:1.4;color:var(--muted);text-align:center;min-height:2.8em}
.used b{color:var(--ink)}
.used button{all:unset;cursor:pointer;color:var(--royal);font-weight:600;text-decoration:underline;text-underline-offset:3px}
.photo{grid-area:photo;border-radius:var(--r-lg);overflow:hidden;background:var(--panel);min-height:360px;position:relative}
.photo img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
.photo .badge{position:absolute;left:16px;bottom:16px;background:var(--navy);color:var(--on-dark);font-family:var(--f-display);font-weight:600;font-size:14px;padding:8px 14px;border-radius:8px}
@media (max-width:960px){.hgrid{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"hi hi" "name name" "photo intro" "photo tools"}}
@media (max-width:620px){.hgrid{grid-template-columns:minmax(0,1fr);grid-template-areas:"hi" "name" "photo" "intro" "tools"}.photo{min-height:0;aspect-ratio:4/5;max-width:100%}}

.facts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin-top:16px}
.fact{background:var(--panel);border-radius:var(--r);padding:20px 22px}
.fact b{display:block;font-family:var(--f-display);font-weight:800;font-size:clamp(34px,4vw,48px);line-height:1;color:var(--royal);font-variant-numeric:tabular-nums}
.fact span{display:block;margin-top:8px;font-size:14.5px;color:var(--muted);line-height:1.35}
@media (max-width:760px){.facts{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* section heads */
.shead{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px 40px;align-items:end;margin-bottom:clamp(28px,4vw,44px)}
.shead h2{font-weight:800;font-size:clamp(36px,5.6vw,68px);line-height:.98;color:var(--royal);letter-spacing:-.035em}
.shead h2 small{display:block;font-size:.42em;font-weight:600;color:var(--ink);letter-spacing:-.01em;margin-bottom:4px}
.shead p{color:var(--muted);max-width:34rem}
@media (max-width:760px){.shead{grid-template-columns:1fr}}

/* areas of interest */
.areas{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.area{grid-column:span 2;border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:10px;background:var(--sky);transition:transform .2s}
.area:hover{transform:translateY(-4px)}
.areawrap:nth-child(1) .area,.areawrap:nth-child(4) .area,.areawrap:nth-child(5) .area{background:var(--blue);color:var(--on-blue)}
.area .ic{width:44px;height:44px;border-radius:12px;background:var(--navy);color:var(--on-dark);display:grid;place-items:center}
.area .ic svg{width:24px;height:24px}
.area h3{font-size:22px;font-weight:700;line-height:1.15}
.area p{font-size:15px;line-height:1.45;opacity:.9}
@media (max-width:900px){.areas{grid-template-columns:repeat(2,minmax(0,1fr))}.areas>.areawrap .area,.areas>.areawrap:nth-child(1) .area,.areas>.areawrap:nth-child(2) .area{grid-column:span 1}.areas>.areawrap:nth-child(1) .area{grid-column:1/-1}}
@media (max-width:480px){.areas{grid-template-columns:1fr}.areas>.areawrap:nth-child(1) .area{grid-column:auto}}

/* skills */
.skills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.sk{background:var(--panel);border-radius:var(--r-lg);padding:24px;display:flex;flex-direction:column;gap:14px}
.sk h3{font-size:19px;font-weight:700}
.sk p{font-size:14.5px;color:var(--muted);line-height:1.45}
.sk:first-child{background:var(--royal);color:var(--bg)}
.sk:first-child p{color:var(--bg);opacity:.85}
.sk:first-child .tags li{background:transparent;border-color:color-mix(in srgb,var(--bg) 40%,transparent);color:var(--bg)}
@media (max-width:900px){.skills{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media (max-width:560px){.skills{grid-template-columns:1fr}}

/* projects */
.filters{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px;align-items:center}
.filters button{all:unset;cursor:pointer;font-weight:600;font-size:14.5px;padding:9px 16px;border-radius:999px;background:var(--panel);color:var(--muted)}
.filters button[aria-pressed="true"]{background:var(--navy);color:var(--on-dark)}
.filters button:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
.filters small{font-family:var(--f-mono);font-size:11.5px;margin-left:6px;opacity:.7}
.filters .toolchip{background:var(--royal);color:var(--bg)}
.projects{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px}
.proj{display:grid;grid-template-rows:auto 1fr;border-radius:var(--r-lg);overflow:hidden;background:var(--panel);min-width:0;transition:transform .2s;animation:pop .35s ease both}
@keyframes pop{from{transform:translateY(10px)}to{transform:none}}
.proj:hover{transform:translateY(-4px)}
.proj .vis{position:relative;aspect-ratio:16/9;max-width:100%;background:var(--sky);overflow:hidden}
.proj .vis img,.proj .vis svg{display:block;width:100%;height:100%;object-fit:cover}
.yr{position:absolute;right:16px;top:16px;background:var(--navy);color:var(--on-dark);font-family:var(--f-display);font-weight:600;font-size:15px;padding:6px 14px;border-radius:6px}
.proj .body{padding:22px 24px 24px;display:flex;flex-direction:column;gap:12px;min-width:0}
.proj .kind{font-family:var(--f-mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--royal)}
.proj h3{font-size:clamp(22px,2.4vw,27px);font-weight:700;line-height:1.12}
.proj p{font-size:15px;color:var(--muted);line-height:1.5}
.proj .shows{color:var(--ink);border-left:3px solid var(--blue);padding-left:12px;font-size:14.5px}
.proj .shows b{font-weight:600}
.proj .links{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.proj .links a{font-weight:600;font-size:14px;text-decoration:none;padding:8px 14px;border-radius:999px;background:var(--bg);border:1px solid var(--line)}
.proj .links a:hover{background:var(--royal);color:var(--bg);border-color:var(--royal)}
.credit{font-size:13.5px}
.credit a{color:var(--royal)}
.empty{grid-column:1/-1;background:var(--panel);border-radius:var(--r-lg);padding:28px;color:var(--muted)}
@media (min-width:821px){.proj.wide{grid-column:1/-1;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-rows:auto}.proj.wide .vis{aspect-ratio:auto;min-height:100%}}
@media (max-width:820px){.projects{grid-template-columns:1fr}}

/* experience */
.tl{display:grid;gap:14px}
.role{display:grid;grid-template-columns:160px minmax(0,1fr);gap:20px;align-items:start;background:var(--panel);border-radius:var(--r);padding:20px 24px}
.role .when{display:inline-block;background:var(--navy);color:var(--on-dark);font-family:var(--f-display);font-weight:600;font-size:13.5px;padding:6px 12px;border-radius:6px;justify-self:start;text-align:center;line-height:1.3}
.role.now .when{background:var(--royal);color:var(--bg)}
.role h3{font-size:19px;font-weight:700;line-height:1.2}
.role .org{color:var(--royal);font-weight:600;font-size:15px;margin-top:2px}
.role ul{margin:10px 0 0;padding-left:18px;display:grid;gap:4px;font-size:15px;color:var(--muted)}
@media (max-width:640px){.role{grid-template-columns:1fr;gap:10px}}

/* education + awards */
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:20px}
.edu{display:grid;gap:14px;align-content:start}
.ed{background:var(--sky);border-radius:var(--r-lg);padding:24px}
.ed .when{font-family:var(--f-mono);font-size:13px;color:var(--royal)}
.ed h3{font-size:21px;font-weight:700;margin-top:6px;line-height:1.2}
.ed .org{font-weight:600;margin-top:2px}
.ed ul{margin:10px 0 0;padding-left:18px;font-size:15px;color:var(--muted);display:grid;gap:4px}
h3.sub{font-size:22px;font-weight:700;margin-bottom:14px;color:var(--royal)}
.awards{display:grid;gap:10px;list-style:none;margin:0;padding:0}
.aw{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:14px;align-items:center;background:var(--panel);border-radius:14px;padding:12px 16px}
.aw .lvl{font-family:var(--f-mono);font-size:11.5px;text-transform:uppercase;letter-spacing:.06em;padding:4px 9px;border-radius:6px;background:var(--bg);border:1px solid var(--line);white-space:nowrap}
.aw.win .lvl{background:var(--royal);color:var(--bg);border-color:var(--royal)}
.aw.semi .lvl{background:var(--sky);border-color:transparent}
.aw span:nth-child(2){font-size:15px;font-weight:500;line-height:1.35}
.aw time{font-family:var(--f-mono);font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
@media (max-width:860px){.two{grid-template-columns:1fr}}

/* contact */
.contact .box{background:var(--navy);color:var(--on-dark);border-radius:var(--r-lg);padding:clamp(28px,5vw,56px);display:grid;grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:28px;align-items:end}
.contact .eyebrow{color:inherit;opacity:.7}
.contact h2{font-size:clamp(32px,4.6vw,54px);font-weight:800;line-height:1.02;letter-spacing:-.035em;margin-top:8px}
.contact p.sub{opacity:.8;margin-top:14px;max-width:32rem}
.contact .mail{font-family:var(--f-mono);font-size:clamp(15px,1.8vw,18px);user-select:all;word-break:break-all}
.contact .row{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
.contact .btn{background:var(--on-dark);color:var(--navy)}
.contact .btn.ghost{background:transparent;color:var(--on-dark);border:1.5px solid color-mix(in srgb,var(--on-dark) 35%,transparent)}
.status{font-size:13.5px;min-height:1.4em;margin-top:8px;opacity:.85}
@media (max-width:760px){.contact .box{grid-template-columns:1fr}}
footer{padding-block:28px 40px;color:var(--muted);font-size:14px}
footer .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:8px}
#boot{padding:40px 16px;font-family:var(--f-body);color:var(--muted)}

/* classic accents */
.shead h2 em,.namebar em,.contact h2 em{font-family:var(--f-serif);font-style:italic;font-weight:600;letter-spacing:-.01em}
.shead h2 em{color:var(--cyan)}
.namebar em{color:var(--royal)}
/* progress, nav extras */
.progress{position:fixed;left:0;right:0;top:env(safe-area-inset-top,0px);height:3px;background:linear-gradient(90deg,var(--royal),var(--cyan));transform-origin:0 50%;z-index:70;pointer-events:none}
.btn.sm{padding:8px 14px;font-size:14px}
.burger{display:none}
.msheet{border-top:1px solid var(--line);padding:8px max(16px,env(safe-area-inset-right,0px)) 14px max(16px,env(safe-area-inset-left,0px));display:grid;gap:2px}
.msheet[hidden]{display:none}
.msheet a{text-decoration:none;font-weight:600;padding:10px 6px;border-radius:10px}
.msheet a:hover{background:var(--panel)}
@media (max-width:900px){.nav ul,.navcta{display:none}.nav .theme:first-of-type{margin-left:auto}.burger{display:grid}}
@media (min-width:901px){.msheet{display:none!important}}
/* opening extras */
.okicker{display:inline-flex;align-items:center;gap:10px;font-family:var(--f-mono);font-size:12.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);background:var(--panel);padding:7px 14px;border-radius:999px;margin-bottom:22px}
.okicker .dot{width:8px;height:8px;border-radius:50%;background:#22C55E;box-shadow:0 0 0 0 rgba(34,197,94,.5);animation:ping 2s infinite}

function useReveal(){
  const ref=useRef(null);
  const [inView,setIn]=useState(false);
  useEffect(()=>{
    const el=ref.current;if(!el)return;
    if(!('IntersectionObserver' in window)||reduce()){setIn(true);return}
    const io=new IntersectionObserver(([e])=>{if(e.isIntersecting){setIn(true);io.disconnect()}},{rootMargin:'0px 0px -10% 0px'});
    io.observe(el);return ()=>io.disconnect();
  },[]);
  return [ref,inView];
}
function Reveal({children,cls,id,as}){
  const [ref,inView]=useReveal();
  const T=as||'div';
  return html`<${T} ref=${ref} id=${id} class=${(cls||'')+' rv'+(inView?' in':'')}>${children}</${T}>`;
}
function CountUp({to,suffix}){
  const [ref,inView]=useReveal();
  const [n,setN]=useState(to);
  const done=useRef(false);
  useEffect(()=>{
    if(!inView||done.current||reduce())return;done.current=true;
    let raf,start;const dur=900;
    const step=t=>{if(!start)start=t;const p=Math.min(1,(t-start)/dur);setN(Math.round(to*(1-Math.pow(1-p,3))));if(p<1)raf=requestAnimationFrame(step)};
    setN(0);raf=requestAnimationFrame(step);return ()=>cancelAnimationFrame(raf);
  },[inView]);
  return html`<b ref=${ref}>${n}${suffix||''}</b>`;
}

function Progress(){
  const [p,setP]=useState(0);
  useEffect(()=>{
    const on=()=>{const h=document.documentElement;const max=h.scrollHeight-h.clientHeight;setP(max>0?h.scrollTop/max:0)};
    on();addEventListener('scroll',on,{passive:true});addEventListener('resize',on);
    return ()=>{removeEventListener('scroll',on);removeEventListener('resize',on)};
  },[]);
  return html`<div class="progress" style=${{transform:'scaleX('+p+')'}} aria-hidden="true"></div>`;
}

function Nav({theme,toggle}){
  const items=[['about','About'],['skills','Skills'],['projects','Projects'],['gallery','Design'],['experience','Experience'],['education','Education'],['contact','Contact']];
  const [on,setOn]=useState('');
  const [open,setOpen]=useState(false);
  useEffect(()=>{
    if(!('IntersectionObserver' in window))return;
    const io=new IntersectionObserver(es=>{es.forEach(e=>{if(e.isIntersecting)setOn(e.target.id)})},{rootMargin:'-45% 0px -50% 0px'});
    items.forEach(([id])=>{const el=document.getElementById(id);if(el)io.observe(el)});
    return ()=>io.disconnect();
  },[]);
  return html`<nav class="nav" aria-label="Main"><div class="wrap">
    <a class="logo" href="#top">Hanif<span>.</span></a>
    <ul>${items.map(([id,l])=>html`<li key=${id}><a href=${'#'+id} class=${on===id?'on':''}>${l}</a></li>`)}</ul>
    <a class="btn solid sm navcta" href="files/Hanif_Wibowo_Resume.pdf" download="Hanif_Wibowo_Resume.pdf">Resume ↓</a>
    <button class="theme" id="theme-toggle" type="button" onClick=${toggle} aria-label=${theme==='dark'?'Switch to light theme':'Switch to dark theme'}>
      ${theme==='dark'
        ?html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>`
        :html`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z"/></svg>`}
    </button>
    <button class="theme burger" id="menu-toggle" type="button" aria-expanded=${open?'true':'false'} aria-controls="mobile-menu" aria-label="Open menu" onClick=${()=>setOpen(!open)}>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round">${open?html`<path d="M6 6l12 12M18 6 6 18"/>`:html`<path d="M4 7h16M4 12h16M4 17h16"/>`}</svg>
    </button>
  </div>
  <div class="msheet" id="mobile-menu" hidden=${!open}>
    ${items.map(([id,l])=>html`<a key=${id} href=${'#'+id} onClick=${()=>setOpen(false)}>${l}</a>`)}
    <a href="files/Hanif_Wibowo_Resume.pdf" download="Hanif_Wibowo_Resume.pdf" onClick=${()=>setOpen(false)}>Resume ↓</a>
  </div></nav>`;
}

/* ---------- opening ---------- */
function ToolBubbles(){
  const box=useRef(null),els=useRef([]);
  useEffect(()=>{
    const host=box.current.parentElement;const still=reduce();
    let W=0,H=0;const B=TOOLS.map((t,k)=>({t,x:0,y:0,vx:0,vy:0,r:34,drag:false,el:els.current[k]}));
    const place=()=>{const r=host.getBoundingClientRect();W=r.width;H=r.height;const R=W<700?26:34;B.forEach((b,k)=>{b.r=R;if(!b.x){b.x=W*(.45+.5*Math.random());b.y=H*(.12+.76*Math.random())}b.x=Math.min(W-R,Math.max(R,b.x));b.y=Math.min(H-R,Math.max(R,b.y));b.el.style.width=b.el.style.height=2*R+'px'});render()};
    const render=()=>{for(const b of B)b.el.style.transform='translate('+(b.x-b.r)+'px,'+(b.y-b.r)+'px)'};
    const m={x:-999,y:-999};let grab=null,last=null,moved=0;
    const pos=e=>{const r=host.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top]};
    const hm=e=>{[m.x,m.y]=pos(e);if(grab){const [x,y]=[m.x,m.y];grab.vx=(x-grab.x);grab.vy=(y-grab.y);moved+=Math.abs(grab.vx)+Math.abs(grab.vy);grab.x=x;grab.y=y;if(still)render()}};
    const hl=()=>{m.x=m.y=-999};
    const down=k=>e=>{e.preventDefault();grab=B[k];grab.drag=true;moved=0;try{e.currentTarget.setPointerCapture(e.pointerId)}catch(_){}};
    const up=k=>e=>{if(grab){grab.drag=false;if(moved<6){dispatchEvent(new CustomEvent('pick-tool',{detail:grab.t.id}))}grab=null}};
    const hs=B.map((b,k)=>{const d=down(k),u=up(k);b.el.addEventListener('pointerdown',d);b.el.addEventListener('pointerup',u);b.el.addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();dispatchEvent(new CustomEvent('pick-tool',{detail:b.t.id}))}});return [d,u]});
    host.addEventListener('pointermove',hm);host.addEventListener('pointerleave',hl);
    const step=()=>{for(const b of B){if(b.drag)continue;
        b.vx+=(Math.random()-.5)*.06;b.vy+=(Math.random()-.5)*.06;
        const dx=b.x-m.x,dy=b.y-m.y,d=Math.hypot(dx,dy),R=120;if(d<R&&d>1){const f=(R-d)/R*.9;b.vx+=dx/d*f;b.vy+=dy/d*f}
        b.vx*=.985;b.vy*=.985;const sp=Math.hypot(b.vx,b.vy);if(sp>14){b.vx*=14/sp;b.vy*=14/sp}
        b.x+=b.vx;b.y+=b.vy;
        if(b.x<b.r){b.x=b.r;b.vx=Math.abs(b.vx)*.8}if(b.x>W-b.r){b.x=W-b.r;b.vx=-Math.abs(b.vx)*.8}
        if(b.y<b.r){b.y=b.r;b.vy=Math.abs(b.vy)*.8}if(b.y>H-b.r){b.y=H-b.r;b.vy=-Math.abs(b.vy)*.8}}
      for(let i=0;i<B.length;i++)for(let j=i+1;j<B.length;j++){const a=B[i],c=B[j],dx=c.x-a.x,dy=c.y-a.y,d=Math.hypot(dx,dy),min=a.r+c.r;
        if(d<min&&d>0){const nx=dx/d,ny=dy/d,o=(min-d)/2;if(!a.drag){a.x-=nx*o;a.y-=ny*o}if(!c.drag){c.x+=nx*o;c.y+=ny*o}
          const rv=(c.vx-a.vx)*nx+(c.vy-a.vy)*ny;if(rv<0){const imp=-rv*.9;if(!a.drag){a.vx-=nx*imp;a.vy-=ny*imp}if(!c.drag){c.vx+=nx*imp;c.vy+=ny*imp}}}}
      render()};
    let vis=true,raf=0;const loop=()=>{raf=0;if(!vis)return;step();raf=requestAnimationFrame(loop)};
    const io=new IntersectionObserver(([e])=>{vis=e.isIntersecting;if(vis&&!raf&&!still)loop()});io.observe(host);
    const ro=new ResizeObserver(place);ro.observe(host);place();if(!still)loop();
    return ()=>{cancelAnimationFrame(raf);io.disconnect();ro.disconnect();host.removeEventListener('pointermove',hm);host.removeEventListener('pointerleave',hl);B.forEach((b,k)=>{b.el.removeEventListener('pointerdown',hs[k][0]);b.el.removeEventListener('pointerup',hs[k][1])})};
  },[]);
  return html`<div class="bubbles" ref=${box}>
    ${TOOLS.map((t,k)=>html`<div key=${t.id} class="bub" ref=${el=>els.current[k]=el} role="button" tabIndex="0" aria-label=${'Show projects using '+t.name} title=${t.name}><${ToolMark} t=${t}/></div>`)}
  </div>`;
}
function magnet(e){if(reduce())return;const b=e.currentTarget,r=b.getBoundingClientRect();b.style.transform='translate('+((e.clientX-r.left-r.width/2)*.18)+'px,'+((e.clientY-r.top-r.height/2)*.25)+'px)'}
function unmagnet(e){e.currentTarget.style.transform=''}

function Opening(){

  useEffect(()=>{
    if(hold||reduce())return;
    const id=setInterval(()=>setI(x=>(x+1)%ROTATE.length),2400);
    return ()=>clearInterval(id);

  const STACK=['KopiCast','Bersama AKU','Kikai Headphone','OLFACTION 2024'].map(t=>PROJECTS.find(p=>p.title===t));
  const [f,setF]=useState(0);
  useEffect(()=>{if(hold||reduce())return;const id=setInterval(()=>setF(x=>(x+1)%STACK.length),3200);return ()=>clearInterval(id)},[hold]);
  const [tilt,setTilt]=useState({x:0,y:0});
  const move=e=>{if(reduce())return;const r=e.currentTarget.getBoundingClientRect();setTilt({x:((e.clientX-r.left)/r.width-.5),y:((e.clientY-r.top)/r.height-.5)})};

    <div>

      <p class="oname">Hanif Wibowo</p>

      <p class="otag">I turn raw data into <strong>clear decisions</strong>, then design the products and interfaces that put them to work.</p>
      <div class="cta">
        <a class="btn solid" href="#projects" onPointerMove=${magnet} onPointerLeave=${unmagnet}>View projects</a>
        <a class="btn ghost" href="https://www.linkedin.com/in/hanifwiibowo" target="_blank" rel="noopener" onPointerMove=${magnet} onPointerLeave=${unmagnet}>LinkedIn ↗</a>
        <a class="btn ghost" href="files/Hanif_Wibowo_Resume.pdf" download="Hanif_Wibowo_Resume.pdf" onPointerMove=${magnet} onPointerLeave=${unmagnet}>Download resume ↓</a>
      </div>
    </div>
    <div class="ostackwrap">
      <div class="ostack" onPointerMove=${move} onPointerEnter=${()=>setHold(true)} onPointerLeave=${()=>{setTilt({x:0,y:0});setHold(false)}}
        style=${{'--tx':tilt.x,'--ty':tilt.y}} role="group" aria-label="Featured projects">
        ${STACK.map((p,k)=>{const pos=(k-f+STACK.length)%STACK.length;return html`<button key=${p.title} type="button" class=${'ocard pos'+pos} onClick=${()=>pos===0?openCase(p.title):setF(k)} onFocus=${()=>{setF(k);setHold(true)}} onBlur=${()=>setHold(false)} aria-label=${(pos===0?'Open case: ':'Show ')+p.title}>
          <img src=${p.img} alt="" loading="eager" /><span class="ocap"><small>${p.kind.split(' · ')[0]}</small><b>${p.title}</b></span></button>`})}
      </div>
      <div class="odots" role="group" aria-label="Choose featured project">${STACK.map((p,k)=>html`<button key=${p.title} type="button" aria-label=${p.title} aria-pressed=${k===f?'true':'false'} onClick=${()=>setF(k)}></button>`)}
        <button type="button" class="ogo" onClick=${()=>openCase(STACK[f].title)}>Open ${STACK[f].title} →</button></div>
    </div>
  </div></header>`;
}

function Card({p,wide,onOpen,toolTag}){
  const ref=useRef(null);
  const move=e=>{if(reduce())return;const el=ref.current;const r=el.getBoundingClientRect();const x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;el.style.transform='perspective(1000px) rotateY('+(x*6)+'deg) rotateX('+(-y*6)+'deg) translateY(-4px)';el.style.setProperty('--gx',(x+.5)*100+'%');el.style.setProperty('--gy',(y+.5)*100+'%')};
  const leave=()=>{if(ref.current)ref.current.style.transform=''};
  return html`<article ref=${ref} class=${'proj'+(wide?' wide':'')} onPointerMove=${move} onPointerLeave=${leave}>
    <${Vis} p=${p}/>
    <div class="body">
      <span class="kind">${p.kind}</span>
      <h3>${p.title}</h3>
      <p class="clamp">${p.desc}</p>
      <ul class="tags">${p.tags.map(x=>html`<li key=${x} class=${toolTag&&x.startsWith(toolTag)?'hit':''}>${x}</li>`)}</ul>
      <div class="links">
        <button type="button" class="open-case" onClick=${onOpen}>Open case →</button>
        ${(p.links||[]).map(([l,h])=>html`<a key=${l} href=${h} target="_blank" rel="noopener">${l} ↗</a>`)}
      </div>
    </div>
  </article>`;
}
function Modal({list,idx,setIdx,close}){
  const p=list[idx];
  const btn=useRef(null);
  const [k,setK]=useState(0);
  useEffect(()=>{setK(0)},[idx]);
  useEffect(()=>{
    const prevOverflow=document.body.style.overflow;document.body.style.overflow='hidden';
    if(btn.current)btn.current.focus();
    const key=e=>{if(e.key==='Escape')close();if(e.key==='ArrowRight')setIdx((idx+1)%list.length);if(e.key==='ArrowLeft')setIdx((idx-1+list.length)%list.length)};
    addEventListener('keydown',key);
    return ()=>{document.body.style.overflow=prevOverflow;removeEventListener('keydown',key)};
  },[idx]);
  const shots=p.shots||[];
  const cur=shots[k]||p.img;
  const linked=p.feats&&shots.length===p.feats.length;
  return html`<div class="scrim" onClick=${close}></div>
  <div class="modal" role="dialog" aria-modal="true" aria-labelledby="case-title">
    <button ref=${btn} type="button" class="btn ghost x" onClick=${close} aria-label="Close case">Close ✕</button>
    <div class="mvis">
      ${cur?html`<img key=${cur} src=${cur} alt=${p.title+' screenshot '+(k+1)} />`:html`<div class="svgbox" dangerouslySetInnerHTML=${{__html:p.svg}}></div>`}
      ${p.year?html`<span class="yr">${p.year}</span>`:null}
      ${shots.length>1?html`<div class="thumbs" role="group" aria-label="Screenshots">${shots.map((s,j)=>html`<button key=${s} type="button" aria-pressed=${j===k?'true':'false'} aria-label=${'Show screenshot '+(j+1)} onClick=${()=>setK(j)}><img src=${s} alt="" /></button>`)}</div>`:null}
    </div>
    <div class="mbody">
      <span class="kind">${p.kind}</span>
      <h3 id="case-title">${p.title}</h3>
      <p>${p.desc}</p>
      ${p.feats?html`<div class="feats">${p.feats.map(([t,d],j)=>html`<button key=${t} type="button" class=${'feat'+(linked&&j===k?' on':'')} disabled=${!linked} onClick=${()=>linked&&setK(j)}><b>${t}</b><span>${d}</span></button>`)}</div>`:null}
      ${p.aspects?html`<div><p class="ah">What visitors said, by aspect</p><div class="asps">${p.aspects.map(([t,d,c])=>html`<span key=${t} class=${'asp '+c}><b>${t}</b>${d}</span>`)}</div></div>`:null}
      <p class="meta"><b>Tools used:</b> ${p.tags.join(', ')}</p>
      ${p.credit?html`<p class="credit">Guided project, built by following a tutorial by <a href="https://www.youtube.com/watch?v=MjeDkDHJqzc" target="_blank" rel="noopener">The Developer on YouTube</a>. The dataset belongs to its original source.</p>`:null}
      ${p.links?html`<div class="links">${p.links.map(([l,h])=>html`<a key=${l} href=${h} target="_blank" rel="noopener">${l} ↗</a>`)}</div>`:null}
      <div class="mnav"><button type="button" class="btn ghost" onClick=${()=>setIdx((idx-1+list.length)%list.length)}>← Previous</button>
        <span class="mcount">${idx+1} / ${list.length}</span>
        <button type="button" class="btn ghost" onClick=${()=>setIdx((idx+1)%list.length)}>Next →</button></div>
    </div>
  </div>`;
}
function Projects({tool,setTool,cat,setCat}){

  const list=useMemo(()=>PROJECTS.filter(p=>(cat==='all'||p.cat===cat)&&(!tool||p.tools.includes(tool))),[cat,tool]);
  const [open,setOpen]=useState(-1);
  useEffect(()=>{const h=e=>{setTool(null);setCat('all');setOpen(PROJECTS.findIndex(p=>p.title===e.detail))};addEventListener('open-case',h);return ()=>removeEventListener('open-case',h)},[]);
  const toolName=tool&&TOOLS.find(t=>t.id===tool).name;
  const toolTag={python:'Python',powerbi:'Power BI',excel:'Excel',figma:'Figma',photoshop:'Photoshop',tableau:'Tableau',spss:'SPSS',minitab:'Minitab',html:'HTML',css:'CSS',javascript:'JavaScript'}[tool];
  return html`<section id="projects"><div class="wrap">
    <div class="shead"><h2><small>Projects</small>Selected <em>work</em></h2><p>Open any card for screenshots and the full case. Data work first, then web apps and design.</p></div>
    <div class="filters" role="group" aria-label="Filter projects">
      ${cats.map(([k,l])=>html`<button key=${k} id=${'f-'+k} type="button" aria-pressed=${cat===k?'true':'false'} onClick=${()=>setCat(k)}>${l}<small>${PROJECTS.filter(p=>(k==='all'||p.cat===k)&&(!tool||p.tools.includes(tool))).length}</small></button>`)}
      ${tool?html`<button type="button" class="toolchip" aria-pressed="true" onClick=${()=>setTool(null)}>Using ${toolName} ✕</button>`:null}
    </div>
    <div class="projects">
      ${list.length===0?html`<p class="empty">No projects in this group use ${toolName}. Clear the tool filter to see everything.</p>`:null}
      ${list.map((p,i)=>html`<${Card} key=${p.title} p=${p} toolTag=${toolTag} wide=${list.length%2===1&&i===list.length-1} onOpen=${()=>setOpen(i)}/>`)}
    </div>
    ${open>=0&&list[open]?html`<${Modal} list=${list} idx=${open} setIdx=${setOpen} close=${()=>setOpen(-1)}/>`:null}
  </div></section>`;
}

function ToTop(){
  const [show,setShow]=useState(false);
  useEffect(()=>{const on=()=>setShow(scrollY>900);on();addEventListener('scroll',on,{passive:true});return ()=>removeEventListener('scroll',on)},[]);
  return html`<a class=${'totop'+(show?' show':'')} href="#top" aria-label="Back to top">↑</a>`;
}

function Backdrop(){
  const ref=useRef(null);
  useEffect(()=>{
    if(reduce())return;let raf=0,x=innerWidth/2,y=innerHeight/3;
    const on=e=>{x=e.clientX;y=e.clientY;if(!raf)raf=requestAnimationFrame(()=>{raf=0;const el=ref.current;if(el){el.style.setProperty('--mx',x+'px');el.style.setProperty('--my',y+'px')}})};
    const sc=()=>{const el=ref.current;if(el)el.style.setProperty('--sy',(scrollY*-.08)+'px')};
    addEventListener('pointermove',on,{passive:true});addEventListener('scroll',sc,{passive:true});
    return ()=>{removeEventListener('pointermove',on);removeEventListener('scroll',sc)};
  },[]);
  return html`<div class="bgfx" ref=${ref} aria-hidden="true"><div class="dots"></div><div class="blob b1"></div><div class="blob b2"></div><div class="blob b3"></div><div class="spot"></div></div>`;
}

function App(){
  const root=document.documentElement;
  const sys=()=>window.matchMedia&&matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';
  const [theme,setTheme]=useState(()=>{try{return localStorage.getItem('hw-theme')||root.getAttribute('data-theme')||sys()}catch(e){return root.getAttribute('data-theme')||sys()}});
  useEffect(()=>{root.setAttribute('data-theme',theme);try{localStorage.setItem('hw-theme',theme)}catch(e){}},[theme]);
  const [tool,setTool]=useState(null);
  const [cat,setCat]=useState('all');
  const goProjects=()=>{const el=document.getElementById('projects');if(el)el.scrollIntoView({behavior:reduce()?'auto':'smooth'})};
  const pick=c=>{setTool(null);setCat(c);goProjects()};
  useEffect(()=>{const h=e=>{setCat('all');setTool(e.detail);goProjects()};addEventListener('pick-tool',h);return ()=>removeEventListener('pick-tool',h)},[]);
  return html`<${React.Fragment}>
    <${Backdrop}/>
    <${Progress}/>
    <${Nav} theme=${theme} toggle=${()=>setTheme(theme==='dark'?'light':'dark')}/>
    <main>
      <${Opening}/>
      <${Band}/>
      <${Hello} tool=${tool} setTool=${setTool} goProjects=${goProjects}/>
      <${About} pick=${pick}/>
      <${Skills}/>
      <${Projects} tool=${tool} setTool=${setTool} cat=${cat} setCat=${setCat}/>
      <${Gallery}/>
      <${Experience}/>
      <${Education}/>
      <${Contact}/>
    </main>
    <footer><div class="wrap"><span>Hanif Wibowo · Surabaya, Indonesia</span></div></footer>
    <${ToTop}/>
  </${React.Fragment}>`;
}

ReactDOM.createRoot(document.getElementById('root')).render(html`<${App}/>`);

})();
</script>
